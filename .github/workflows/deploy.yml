name: Deploy Floatline to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v6

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le dossier dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
